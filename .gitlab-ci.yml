stages:
  - build
  - deploy

# ---------------- GLOBAL VARIABLES ----------------
variables:
  SSH_USER: "girjesh"
  SERVER_IP: "89.116.122.211"
  SSH_PORT: "30022"
  FRONTEND_DIR: "/home/girjesh/scriza/app/schoolERP/frontend"
  PM2_APP_NAME: "ERPFrontend"
  PORT: "5173"

# ---------------- BUILD ----------------
build_job:
  stage: build
  image: node:latest
  script:
    - npm install
    - npm run build
    - ls -la dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1h

# ---------------- DEPLOY ----------------
deploy:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build_job

  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - touch ~/.ssh/known_hosts
    - ssh-keyscan -p $SSH_PORT -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null || true

  script:
    # Ensure frontend directory exists
    - ssh -p $SSH_PORT -o IdentitiesOnly=yes -i ~/.ssh/id_rsa $SSH_USER@$SERVER_IP "mkdir -p $FRONTEND_DIR && chmod -R 755 $FRONTEND_DIR"

    # Copy dist folder (SINGLE LINE – VERY IMPORTANT)
    - scp -P $SSH_PORT -o IdentitiesOnly=yes -i ~/.ssh/id_rsa -r dist $SSH_USER@$SERVER_IP:$FRONTEND_DIR/

    # Verify files
    - ssh -p $SSH_PORT -o IdentitiesOnly=yes -i ~/.ssh/id_rsa $SSH_USER@$SERVER_IP "ls -la $FRONTEND_DIR/dist"

    # Start / Restart PM2
    - ssh -p $SSH_PORT -o IdentitiesOnly=yes -i ~/.ssh/id_rsa $SSH_USER@$SERVER_IP "export PATH=\$PATH:/home/girjesh/.npm-global/bin && if pm2 list | grep -q $PM2_APP_NAME; then pm2 restart $PM2_APP_NAME; else pm2 start serve --name $PM2_APP_NAME -- -s $FRONTEND_DIR/dist -l $PORT; fi && pm2 save"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
